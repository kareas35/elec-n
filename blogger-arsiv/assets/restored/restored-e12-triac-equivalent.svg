<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 640 330" width="640" height="330">
<title>Triyak ve ters paralel SCR eşdeğeri - restorasyon taslağı</title>
<desc>Solda triyak sembolü, sağda iki SCR'nin işlevsel ters paralel eşdeğeri. Orijinal görsel değildir.</desc>

<g fill="none" stroke="#111" stroke-width="3"
stroke-linecap="round" stroke-linejoin="round">
<!-- Triyak: ana terminaller -->
<path d="M145 35 V95 M145 195 V265"/>
<!-- Üst ve alt karşıt yönlü semboller -->
<path d="M115 95 L175 95 L145 140 Z"/>
<path d="M115 195 L175 195 L145 150 Z"/>
<path d="M112 145 H178"/>
<!-- Gate, MT1 tarafında -->
<path d="M60 230 H88 L125 185"/>

<!-- Ters paralel SCR: ortak üst ve alt düğümler -->
<path d="M380 60 H530"/>
<path d="M380 260 H530"/>
<!-- SCR 1: üstten alta -->
<path d="M410 60 V118"/>
<path d="M382 118 L438 118 L410 157 Z"/>
<path d="M380 164 H440"/>
<path d="M410 164 V260"/>
<!-- SCR 2: alttan üste -->
<path d="M500 260 V202"/>
<path d="M472 202 L528 202 L500 163 Z"/>
<path d="M470 156 H530"/>
<path d="M500 156 V60"/>
<!-- Bağımsız gate uçları -->
<path d="M340 187 H365 L393 158"/>
<path d="M547 133 H570 L517 158"/>
</g>

<g font-family="Arial,sans-serif" fill="#111" font-size="15">
<text x="158" y="42">A2 / MT2</text>
<text x="158" y="266">A1 / MT1</text>
<text x="43" y="226">G</text>
<text x="95" y="303">Triyak sembolü</text>
<text x="440" y="46">MT2</text>
<text x="440" y="284">MT1</text>
<text x="328" y="206">G1</text>
<text x="556" y="125">G2</text>
<text x="394" y="303">İki ters paralel SCR</text>
</g>
<text x="320" y="323"
font-family="Arial,sans-serif" font-size="12" fill="#555">
İşlevsel eşdeğerlik - gerçek triyakın birebir iç yapısı değildir
</text>
</svg>