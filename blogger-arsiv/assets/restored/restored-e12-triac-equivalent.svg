<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc">
<title id="title">Triyak sembolü ve ters paralel iki SCR ile işlevsel karşılaştırma</title>
<desc id="desc">Solda tek gate uçlu triyakın standart şema sembolü; sağda her biri ayrı gate uçlu iki SCR'nin zıt yönlü paralel gösterimi. İki SCR çizimi triyakın birebir iç yapısı veya birebir eşdeğer bağlantısı değildir.</desc>
<rect width="800" height="360" fill="white"/>
<g fill="none" stroke="#18212d" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
<!-- TRIAC: opposing thyristor triangles and common gate; terminals MT2/MT1 -->
<path d="M195 55 V105 M195 235 V287"/>
<path d="M150 111 H240 L195 161 Z"/>
<path d="M150 230 H240 L195 180 Z"/>
<path d="M145 169 H245"/>
<path d="M105 259 H130 L167 210"/>
<!-- Conceptual pair: common terminals, reverse-parallel main current paths -->
<path d="M445 65 H650 M445 280 H650"/>
<!-- SCR left branch: downward conduction -->
<path d="M495 65 V125 M495 188 V280"/>
<path d="M465 126 H525 L495 174 Z"/>
<path d="M461 181 H529"/>
<path d="M441 201 H458 L480 168"/>
<!-- SCR right branch: upward conduction -->
<path d="M610 65 V158 M610 220 V280"/>
<path d="M580 217 H640 L610 170 Z"/>
<path d="M575 163 H645"/>
<path d="M660 136 H648 L625 181"/>
</g>
<g font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#18212d">
<text x="209" y="62">MT2 / A2</text><text x="209" y="291">MT1 / A1</text><text x="88" y="276">G</text>
<text x="445" y="52">Uç 2</text><text x="445" y="302">Uç 1</text>
<text x="413" y="225">G1</text><text x="661" y="127">G2</text>
<text x="123" y="326" font-weight="bold">Triyak: tek gate</text>
<text x="440" y="326" font-weight="bold">İki SCR: ayrı gate'ler</text>
</g>
<text x="400" y="348" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" fill="#555">İşlevsel benzetimdir; gerçek bağlantı planı veya birebir iç yapı değildir.</text>
</svg>
