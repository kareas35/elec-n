<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 420 180" width="420" height="180">
<title>Kondansatör sembolleri - restorasyon</title>
<g fill="none" stroke="#111" stroke-width="3"
stroke-linecap="round" stroke-linejoin="round">
  <!-- Non-polarized capacitor -->
  <path d="M35 90 H120"/>
  <path d="M120 55 V125"/>
  <path d="M145 55 V125"/>
  <path d="M145 90 H230"/>

  <!-- Electrolytic capacitor -->
  <path d="M245 90 H305"/>
  <path d="M305 55 V125"/>
  <path d="M328 60 Q345 90 328 120"/>
  <path d="M336.5 90 H390"/>

  <!-- Plus sign -->
  <path d="M281 42 V58"/>
  <path d="M273 50 H289"/>
</g>

<g font-family="Arial,sans-serif" fill="#111" font-size="16" text-anchor="middle">
  <text x="132" y="155">Kondansatör</text>
  <text x="318" y="155">Elektrolitik</text>
</g>
</svg>