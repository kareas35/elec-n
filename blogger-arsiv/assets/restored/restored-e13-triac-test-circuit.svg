<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 365" width="780" height="365" role="img" aria-labelledby="title desc">
<title id="title">Triyakın çalışmasını açıklayan işlev blok diyagramı</title>
<desc id="desc">İzole ve düşük gerilimli alternatif akım kaynağı, yük ve triyak işlev bloğu ile gate kumandası. Bu bir kablolama veya ölçüm devresi değildir.</desc>
<rect width="780" height="365" fill="white"/>
<g font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" fill="#18212d">
<text x="390" y="33" font-size="24" font-weight="bold">Triyak ile yük kontrolünün çalışma prensibi</text>
<rect x="230" y="59" width="320" height="69" rx="9" fill="#f1f5f9" stroke="#18212d" stroke-width="2.5"/>
<text x="390" y="88" font-size="19">İzole, düşük gerilimli</text><text x="390" y="111" font-size="19">AC kaynak</text>
<rect x="230" y="169" width="320" height="76" rx="9" fill="#f1f5f9" stroke="#18212d" stroke-width="2.5"/>
<text x="390" y="198" font-size="19">Yük + Triyak</text><text x="390" y="222" font-size="15">Ana akım yolu</text>
<rect x="230" y="280" width="320" height="53" rx="9" fill="#f1f5f9" stroke="#18212d" stroke-width="2.5"/>
<text x="390" y="311" font-size="18">Gate tetikleme denetimi</text>
</g>
<g fill="none" stroke="#18212d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M390 128 V169 M382 159 L390 169 L398 159"/>
<path d="M390 280 V245 M382 254 L390 245 L398 254"/>
</g>
<text x="390" y="352" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" fill="#7c2d12">EĞİTİM ŞEMASI — Elektriksel bağlantı veya test talimatı değildir</text>
</svg>
